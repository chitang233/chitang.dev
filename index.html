<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi_Tang</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #E5E7EB; /* 使用一个稍暗的背景色来凸显卡片 */
            font-family: sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        .profile-card {
            background-color: #F3F4F6;
            border-radius: 16px; /* 圆角 */
            padding: 24px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%; /* 圆形头像 */
            object-fit: cover;
            margin-bottom: 16px;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            color: #374151;
            margin: 0 0 8px 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px; /* 图标之间的间距 */
        }

        .social-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            transition: background-color 0.2s ease-in-out;
        }

        .social-button svg {
            width: 24px;
            height: 24px;
            fill: #4B5563;
            transition: fill 0.2s ease-in-out;
        }

        .social-button:hover svg {
            fill: #1F2937; /* 鼠标悬停时图标颜色变深 */
        }

        /* Dark Mode Styles */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1F2937; /* 深色背景 */
            }
            .profile-card {
                background-color: #374151; /* 深色卡片 */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            }
            .name {
                color: #F9FAFB; /* 亮色文字 */
            }
            .bio {
                color: #D1D5DB; /* 稍暗的亮色文字 */
            }
            .social-button svg {
                fill: #9CA3AF; /* 中性灰色图标 */
            }
            .social-button:hover svg {
                fill: #F9FAFB; /* 悬停时亮色图标 */
            }
        }

    </style>
</head>
